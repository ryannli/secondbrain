<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <!-- Eye-like: insight, vision -->
  <!-- Outer eye shape -->
  <path
    d="M 6 32 Q 32 8 58 32 Q 32 56 6 32"
    stroke="#3b6044"
    stroke-width="2"
    fill="none"
    opacity="0.3"
  />
  <!-- Iris -->
  <circle cx="32" cy="32" r="12" stroke="#3b6044" stroke-width="2" opacity="0.6"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="6" fill="#3b6044" opacity="0.8"/>
  <!-- Highlight -->
  <circle cx="35" cy="29" r="2" fill="white" opacity="0.6"/>
</svg>
