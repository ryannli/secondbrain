<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <!-- B made of dots/atoms in concentric arrangement -->
  <!-- Outer ring of dots forming B shape -->
  <circle cx="18" cy="10" r="2.5" fill="#3b6044" opacity="0.3"/>
  <circle cx="18" cy="18" r="2.5" fill="#3b6044" opacity="0.35"/>
  <circle cx="18" cy="26" r="2.5" fill="#3b6044" opacity="0.4"/>
  <circle cx="18" cy="34" r="2.5" fill="#3b6044" opacity="0.45"/>
  <circle cx="18" cy="42" r="2.5" fill="#3b6044" opacity="0.5"/>
  <circle cx="18" cy="50" r="2.5" fill="#3b6044" opacity="0.55"/>

  <!-- Top curve -->
  <circle cx="28" cy="10" r="2" fill="#3b6044" opacity="0.4"/>
  <circle cx="38" cy="12" r="2" fill="#3b6044" opacity="0.45"/>
  <circle cx="44" cy="18" r="2" fill="#3b6044" opacity="0.5"/>
  <circle cx="44" cy="26" r="2" fill="#3b6044" opacity="0.55"/>
  <circle cx="36" cy="30" r="2" fill="#3b6044" opacity="0.6"/>

  <!-- Bottom curve -->
  <circle cx="28" cy="34" r="2" fill="#3b6044" opacity="0.5"/>
  <circle cx="40" cy="36" r="2" fill="#3b6044" opacity="0.55"/>
  <circle cx="48" cy="42" r="2.5" fill="#3b6044" opacity="0.65"/>
  <circle cx="46" cy="50" r="2" fill="#3b6044" opacity="0.7"/>
  <circle cx="36" cy="54" r="2" fill="#3b6044" opacity="0.75"/>
  <circle cx="26" cy="54" r="2" fill="#3b6044" opacity="0.8"/>

  <!-- Center accent dots -->
  <circle cx="32" cy="20" r="3" fill="#3b6044" opacity="0.8"/>
  <circle cx="34" cy="44" r="3.5" fill="#3b6044"/>
</svg>
