<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <!-- Broken arcs instead of full circles: more dynamic -->
  <!-- Outer arc -->
  <path d="M 32 8 A 24 24 0 0 1 56 32" stroke="#3b6044" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M 56 32 A 24 24 0 0 1 32 56" stroke="#3b6044" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 32 56 A 24 24 0 0 1 8 32" stroke="#3b6044" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Middle arc -->
  <path d="M 32 16 A 16 16 0 0 1 48 32" stroke="#3b6044" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 48 32 A 16 16 0 0 1 32 48" stroke="#3b6044" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 32 48 A 16 16 0 0 1 16 32" stroke="#3b6044" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>

  <!-- Inner circle -->
  <circle cx="32" cy="32" r="8" stroke="#3b6044" stroke-width="2" fill="none"/>
  <circle cx="32" cy="32" r="3" fill="#3b6044"/>
</svg>
