<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <!-- Stacked cards: layered information -->
  <!-- Back card -->
  <rect x="18" y="10" width="32" height="24" rx="3" fill="#3b6044" opacity="0.2"/>
  <!-- Middle card -->
  <rect x="14" y="18" width="32" height="24" rx="3" fill="#3b6044" opacity="0.4"/>
  <!-- Front card -->
  <rect x="10" y="26" width="32" height="24" rx="3" fill="#3b6044"/>
  <!-- Lines on front card suggesting content -->
  <line x1="16" y1="34" x2="34" y2="34" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="40" x2="28" y2="40" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
