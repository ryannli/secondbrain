<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <!-- Concentric + small nodes on rings: knowledge points -->
  <circle cx="32" cy="32" r="24" stroke="#3b6044" stroke-width="1.5" opacity="0.3"/>
  <circle cx="32" cy="32" r="16" stroke="#3b6044" stroke-width="1.5" opacity="0.5"/>
  <circle cx="32" cy="32" r="8" stroke="#3b6044" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="#3b6044"/>

  <!-- Nodes on outer ring -->
  <circle cx="32" cy="8" r="2.5" fill="#3b6044" opacity="0.5"/>
  <circle cx="52" cy="44" r="2" fill="#3b6044" opacity="0.4"/>

  <!-- Nodes on middle ring -->
  <circle cx="18" cy="24" r="2" fill="#3b6044" opacity="0.6"/>
  <circle cx="44" cy="24" r="1.5" fill="#3b6044" opacity="0.5"/>
</svg>
