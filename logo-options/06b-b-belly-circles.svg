<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <!-- B with concentric circles as the two bellies -->
  <!-- Vertical stem -->
  <rect x="16" y="10" width="6" height="44" rx="1" fill="#3b6044"/>

  <!-- Upper belly - concentric -->
  <circle cx="36" cy="22" r="12" fill="#3b6044" opacity="0.15"/>
  <circle cx="36" cy="22" r="8" fill="#3b6044" opacity="0.3"/>
  <circle cx="36" cy="22" r="4" fill="#3b6044" opacity="0.6"/>

  <!-- Lower belly - concentric (slightly larger) -->
  <circle cx="38" cy="42" r="14" fill="#3b6044" opacity="0.15"/>
  <circle cx="38" cy="42" r="9" fill="#3b6044" opacity="0.3"/>
  <circle cx="38" cy="42" r="4.5" fill="#3b6044" opacity="0.6"/>
</svg>
