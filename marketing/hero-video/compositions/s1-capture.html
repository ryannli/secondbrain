<!doctype html>
<html><head><meta charset="UTF-8" /></head><body>
<template>
  <style>
      #root { position: absolute; inset: 0; font-family: "Outfit", sans-serif; color: #27272a; }
      .ghost { position: absolute; right: 22px; top: 96px; z-index: 2; writing-mode: vertical-rl;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.42em;
        color: rgba(59,96,68,0.42); white-space: nowrap; }
      .stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; }
      .shot { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      .shot > img.fill { display: block; width: 100%; }
      .caption { position: absolute; left: 64px; bottom: 22px; z-index: 2; display: flex; align-items: center; gap: 12px; }
      .caption .idx { font-family: "Space Mono", monospace; font-size: 13px; font-weight: 700; color: #3b6044; letter-spacing: 0.1em; }
      .caption .txt { font-size: 20px; font-weight: 700; }
      .caption .rule { width: 34px; height: 2px; background: rgba(59,96,68,0.4); }
      .cursor { position: absolute; width: 26px; z-index: 9; }

      
      .beat { position: absolute; inset: 0; visibility: hidden; }
      .beat .stage { transform-origin: 82% 86%; }
      .srcbadge { position: absolute; left: 18px; top: 16px; z-index: 4;
        font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
        background: rgba(39,39,42,0.82); color: #fff; border-radius: 8px; padding: 6px 10px; }
      .pill { position: absolute; right: 36px; bottom: 40px; display: flex; align-items: center; gap: 9px;
        padding: 12px 16px; border-radius: 26px; color: #fff; font-weight: 700; font-size: 15px;
        background: #3b6044; box-shadow: 0 6px 18px rgba(0,0,0,0.18); z-index: 3; }
      .pill svg { display: block; width: 19px; height: 19px; }
      .pill.done { background: #22c55e; opacity: 0; }
      .clickfx { position: absolute; right: 76px; bottom: 46px; width: 36px; height: 36px; z-index: 6;
        border: 3px solid rgba(59,96,68,0.85); border-radius: 50%; opacity: 0; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1280" data-height="800">
    <div class="ghost">CAPTURE &times; 3</div>
    <div class="beat" id="b1">
      <div class="stage" id="b1-stage">
        <div class="shot">
          <img class="fill" src="assets/cap-news.png" alt="" data-layout-allow-overflow />
          <div class="srcbadge">TECHCRUNCH — NEWS</div>
          <div class="pill" id="b1-pill"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" opacity="0.25"/><circle cx="32" cy="32" r="20" fill="#fff" opacity="0.4"/><circle cx="32" cy="32" r="12" fill="#fff" opacity="0.6"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg><span>Capture</span></div>
          <div class="pill done" id="b1-done"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" opacity="0.25"/><circle cx="32" cy="32" r="20" fill="#fff" opacity="0.4"/><circle cx="32" cy="32" r="12" fill="#fff" opacity="0.6"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg><span>Captured!</span></div>
          <div class="clickfx" id="b1-fx"></div>
        </div>
      </div>
    </div>
    <div class="beat" id="b2">
      <div class="stage" id="b2-stage">
        <div class="shot">
          <img class="fill" src="assets/cap-tweet.png" alt="" data-layout-allow-overflow />
          <div class="srcbadge">X — A THREAD YOU SAVED</div>
          <div class="pill" id="b2-pill"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" opacity="0.25"/><circle cx="32" cy="32" r="20" fill="#fff" opacity="0.4"/><circle cx="32" cy="32" r="12" fill="#fff" opacity="0.6"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg><span>Capture</span></div>
          <div class="pill done" id="b2-done"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" opacity="0.25"/><circle cx="32" cy="32" r="20" fill="#fff" opacity="0.4"/><circle cx="32" cy="32" r="12" fill="#fff" opacity="0.6"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg><span>Captured!</span></div>
          <div class="clickfx" id="b2-fx"></div>
        </div>
      </div>
    </div>
    <div class="beat" id="b3">
      <div class="stage" id="b3-stage">
        <div class="shot">
          <img class="fill" src="assets/cap-anthropic.png" alt="" data-layout-allow-overflow />
          <div class="srcbadge">ANTHROPIC — ENGINEERING</div>
          <div class="pill" id="b3-pill"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" opacity="0.25"/><circle cx="32" cy="32" r="20" fill="#fff" opacity="0.4"/><circle cx="32" cy="32" r="12" fill="#fff" opacity="0.6"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg><span>Capture</span></div>
          <div class="pill done" id="b3-done"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" opacity="0.25"/><circle cx="32" cy="32" r="20" fill="#fff" opacity="0.4"/><circle cx="32" cy="32" r="12" fill="#fff" opacity="0.6"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg><span>Captured! Open &rarr;</span></div>
          <div class="clickfx" id="b3-fx"></div>
        </div>
      </div>
    </div>
    <div class="caption">
      <span class="idx">01</span><span class="rule"></span>
      <span class="txt">Capture anything &mdash; news, threads, papers</span>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    (() => {
      const tl = gsap.timeline({ paused: true });
      const S = sel => '[data-composition-id="s1"] ' + sel;
      tl.fromTo(S(".caption"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, 0.1);
      tl.fromTo(S(".ghost"), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, 0);
      const beats = [
        { id: "#b1", t0: 0.00, dur: 1.15, zoom: 1.22 },
        { id: "#b2", t0: 1.15, dur: 1.15, zoom: 1.34 },
        { id: "#b3", t0: 2.30, dur: 1.90, zoom: 1.48 },
      ];
      beats.forEach((b, i) => {
        const last = i === beats.length - 1;
        tl.set(S(b.id), { autoAlpha: 1 }, b.t0);
        if (!last) tl.set(S(b.id), { autoAlpha: 0 }, b.t0 + b.dur);
        /* click: pill press + ripple ring bursting from the button */
        tl.to(S(b.id + "-pill"), { scale: 1.18, duration: 0.09, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, b.t0 + 0.18);
        tl.fromTo(S(b.id + "-fx"), { opacity: 0.95, scale: 0.35 },
                  { opacity: 0, scale: 2.4, duration: 0.45, ease: "power2.out", transformOrigin: "50% 50%" }, b.t0 + 0.18);
        tl.to(S(b.id + "-stage"), { scale: b.zoom, duration: 0.32, ease: "back.out(1.4)" }, b.t0 + 0.22);
        tl.to(S(b.id + "-pill"), { opacity: 0, duration: 0.08 }, b.t0 + 0.5);
        tl.fromTo(S(b.id + "-done"), { opacity: 0, scale: 0.75 },
                  { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)", transformOrigin: "50% 50%" }, b.t0 + 0.5);
      });
      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
</body></html>
