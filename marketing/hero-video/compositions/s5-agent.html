<!doctype html>
<html><head><meta charset="UTF-8" /></head><body>
<template>
  <style>
      #root { position: absolute; inset: 0; font-family: "Outfit", sans-serif; color: #27272a; }
      .ghost { position: absolute; right: 22px; top: 96px; z-index: 2; writing-mode: vertical-rl;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.42em;
        color: rgba(59,96,68,0.42); white-space: nowrap; }
      .stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; }
      .shot { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      .shot > img.fill { display: block; width: 100%; }
      .caption { position: absolute; left: 64px; bottom: 22px; z-index: 2; display: flex; align-items: center; gap: 12px; }
      .caption .idx { font-family: "Space Mono", monospace; font-size: 13px; font-weight: 700; color: #3b6044; letter-spacing: 0.1em; }
      .caption .txt { font-size: 20px; font-weight: 700; }
      .caption .rule { width: 34px; height: 2px; background: rgba(59,96,68,0.4); }
      .cursor { position: absolute; width: 26px; z-index: 9; }

      
      #s5-stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; }
      .shotc { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      .base { position: absolute; left: 0; top: 0; width: 1152px; }
      .base img { display: block; width: 100%; }
      /* panel window: only this strip scrolls */
      #s5-panelwin { position: absolute; left: 756px; top: 0; width: 396px; height: 664px; overflow: hidden; }
      #s5-panelwin .lay { position: absolute; left: -756px; top: 0; width: 1152px; }
      #s5-panelwin .lay img { display: block; width: 100%; }
      #s5-reply-lay { opacity: 0; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1280" data-height="800">
    <div class="ghost">ASK</div>
    <div id="s5-stage">
      <div class="shotc">
        <div class="base" data-layout-allow-overflow><img src="assets/agent-sent.png" alt="" data-layout-allow-overflow /></div>
        <div id="s5-panelwin" data-layout-allow-overflow>
          <div class="lay" id="s5-sent-lay" data-layout-allow-overflow><img src="assets/agent-sent.png" alt="" data-layout-allow-overflow /></div>
          <div class="lay" id="s5-reply-lay" data-layout-allow-overflow><img src="assets/agent-reply.png" alt="" data-layout-allow-overflow /></div>
        </div>
      </div>
    </div>
    <div class="caption">
      <span class="idx">05</span><span class="rule"></span>
      <span class="txt">Ask across everything you've read &mdash; it shows its work</span>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    (() => {
      const tl = gsap.timeline({ paused: true });
      const S = sel => '[data-composition-id="s5"] ' + sel;
      tl.fromTo(S("#s5-stage"), { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.3 }, 0);
      tl.fromTo(S(".caption"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.15);
      tl.fromTo(S(".ghost"), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8 }, 0);
      /* zoom IN on the just-sent question (real render) */
      tl.set(S("#s5-stage"), { transformOrigin: "86% 18%" }, 0);
      tl.to(S("#s5-stage"), { scale: 1.95, duration: 0.7, ease: "power2.inOut" }, 0.5);
      /* the reply lands; zoom back out to read it */
      tl.to(S("#s5-reply-lay"), { opacity: 1, duration: 0.3 }, 1.9);
      tl.set(S("#s5-stage"), { transformOrigin: "88% 40%" }, 2.24);
      tl.to(S("#s5-stage"), { scale: 1.35, duration: 0.65, ease: "power2.inOut" }, 2.25);
      /* scroll ONLY the agent column down the answer */
      tl.to(S("#s5-panelwin .lay"), { y: -620, duration: 1.7, ease: "power2.inOut" }, 3.3);
      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
</body></html>
