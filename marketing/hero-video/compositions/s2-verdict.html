<!doctype html>
<html><head><meta charset="UTF-8" /></head><body>
<template>
  <style>
      #root { position: absolute; inset: 0; font-family: "Outfit", sans-serif; color: #27272a; }
      .ghost { position: absolute; right: 22px; top: 96px; z-index: 2; writing-mode: vertical-rl;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.42em;
        color: rgba(59,96,68,0.42); white-space: nowrap; }
      .stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; }
      .shot { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      .shot > img.fill { display: block; width: 100%; }
      .caption { position: absolute; left: 64px; bottom: 22px; z-index: 2; display: flex; align-items: center; gap: 12px; }
      .caption .idx { font-family: "Space Mono", monospace; font-size: 13px; font-weight: 700; color: #3b6044; letter-spacing: 0.1em; }
      .caption .txt { font-size: 20px; font-weight: 700; }
      .caption .rule { width: 34px; height: 2px; background: rgba(59,96,68,0.4); }
      .cursor { position: absolute; width: 26px; z-index: 9; }

      
      #s2-stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; transform-origin: 50% 42%; }
      .shotc { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      .shotc img { display: block; width: 100%; }
      #s2-ring { position: absolute; left: 256px; top: 322px; width: 277px; height: 156px;
        border: 3px solid #3b6044; border-radius: 14px; opacity: 0;
        box-shadow: 0 0 0 6px rgba(59,96,68,0.10); }
  </style>
  <div id="root" data-composition-id="s2" data-width="1280" data-height="800">
    <div class="ghost">TRIAGE</div>
    <div id="s2-stage">
      <div class="shotc">
        <img src="assets/dashboard.png" alt="" data-layout-allow-overflow />
        <div id="s2-ring"></div>
      </div>
    </div>
    <div class="caption">
      <span class="idx">02</span><span class="rule"></span>
      <span class="txt">Three verdicts, five seconds &mdash; must-read, skim, or skip</span>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    (() => {
      const tl = gsap.timeline({ paused: true });
      const S = sel => '[data-composition-id="s2"] ' + sel;
      tl.fromTo(S("#s2-stage"), { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35 }, 0);
      tl.fromTo(S(".caption"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.15);
      tl.fromTo(S(".ghost"), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8 }, 0);
      tl.to(S("#s2-stage"), { scale: 1.07, duration: 2.6, ease: "sine.inOut" }, 0.1);
      /* verdict ring hops across the three fresh captures */
      tl.fromTo(S("#s2-ring"), { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, 0.45);
      tl.to(S("#s2-ring"), { x: 293, duration: 0.3, ease: "power2.inOut" }, 1.0);
      tl.to(S("#s2-ring"), { scale: 1.06, duration: 0.1, yoyo: true, repeat: 1 }, 1.3);
      tl.to(S("#s2-ring"), { x: 585, duration: 0.3, ease: "power2.inOut" }, 1.7);
      tl.to(S("#s2-ring"), { scale: 1.06, duration: 0.1, yoyo: true, repeat: 1 }, 2.0);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
</body></html>
