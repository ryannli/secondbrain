<!doctype html>
<html><head><meta charset="UTF-8" /></head><body>
<template>
  <style>
      #root { position: absolute; inset: 0; font-family: "Outfit", sans-serif; color: #27272a; }

        font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.42em;
        color: rgba(59,96,68,0.42); white-space: nowrap; }
      .stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; }
      .shot { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      .shot > img.fill { display: block; width: 100%; }

      #s4-stage { position: absolute; left: 64px; top: 76px; width: 1152px; height: 664px; z-index: 1; transform-origin: 58% 44%; }
      .shotc { position: absolute; inset: 0; overflow: hidden; background: #fff;
        border: 2px solid #e4e1db; border-radius: 16px; box-shadow: 0 24px 64px rgba(59,96,68,0.16); }
      #s4-scroller { position: absolute; left: 0; top: 0; width: 1152px; }

      #s4-star { position: absolute; left: 386px; top: 446px; width: 26px; height: 26px; }
      #s4-star svg { display: block; width: 100%; height: 100%; }

  </style>
  <div id="root" data-composition-id="s4" data-width="1280" data-height="800">

  <script>
    window.__timelines = window.__timelines || {};
    (() => {
      const tl = gsap.timeline({ paused: true });
      const S = sel => '[data-composition-id="s4"] ' + sel;
      tl.fromTo(S("#s4-stage"), { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 0);

      tl.to(S("#s4-cursor"), { x: -95, y: 92, duration: 0.4, ease: "power2.inOut" }, 0.9);
